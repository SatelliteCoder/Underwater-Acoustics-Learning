name: 推荐水声学资源
description: 推荐一个水声学相关开源项目、数据集、课程或工具
title: "[Resource] "
labels: ["resource"]
body:
  - type: input
    id: name
    attributes:
      label: 资源名称
      placeholder: 例如 Acoustics Toolbox
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 链接
      placeholder: https://github.com/...
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 分类
      options:
        - 水声传播与声场建模
        - 阵列信号处理与声呐
        - 水声通信与网络
        - 被动声学监测
        - 数据集
        - 课程/讲义/书籍
        - 海洋环境数据与工具
        - 其他
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: 学习价值
      description: 简要说明为什么值得收录。
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: 许可证或使用条款
      placeholder: 例如 MIT / GPL / Apache-2.0 / 数据集需申请

